[theme]
base = "dark"
primaryColor = "#c9933a"
backgroundColor = "#13120f"
secondaryBackgroundColor = "#1a1815"
textColor = "#e8e0d0"
font = "serif"

[server]
# Must match MAX_FILE_SIZE_MB in config/settings.py (Groq's audio cap).
# When this was 200, the UI accepted a 180 MB file, uploaded all of it,
# then rejected it at validation — wasting the user's time and bandwidth.
maxUploadSize = 25

[browser]
gatherUsageStats = false #i am not sending stats to streamlit
